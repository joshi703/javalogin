
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | eMudhra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee7ff, #d8c7ff);
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 38px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(50, 20, 90, 0.15);
        }

        h2 {
            color: #51218a;
            text-align: center;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 18px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6525a5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #49177e;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        .success {
            background: #e5f7e9;
            color: #216b35;
        }

        .error {
            background: #fff0ed;
            color: #a12b20;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #6525a5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address.
        We will generate a password reset link for you.
    </p>

    <form th:action="@{/forgot-password}" method="post">

        <input type="email"
               name="email"
               placeholder="Enter your registered email"
               required>

        <button type="submit">Generate Reset Link</button>

    </form>

    <div th:if="${param.sent}" class="message success">
        If the account exists, a reset link has been generated.
        Check the application console during local testing.
    </div>

    <div th:if="${param.invalid}" class="message error">
        Your reset link is invalid or expired. Please try again.
    </div>

    <a th:href="@{/login}">Back to Login</a>

</div>

</body>
</html>

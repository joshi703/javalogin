
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | eMudhra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee7ff, #d8c7ff);
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 38px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(50, 20, 90, 0.15);
        }

        h2 {
            color: #51218a;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #6525a5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #49177e;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6525a5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Your Password</h2>

    <p>Enter your new password below.</p>

    <form th:action="@{/reset-password}" method="post">

        <input type="hidden" name="token" th:value="${token}">

        <input type="password"
               name="newPassword"
               placeholder="Enter new password"
               minlength="8"
               required>

        <input type="password"
               name="confirmPassword"
               placeholder="Confirm new password"
               minlength="8"
               required>

        <button type="submit">Update Password</button>

    </form>

    <a th:href="@{/login}">Back to Login</a>

</div>

</body>
</html>
